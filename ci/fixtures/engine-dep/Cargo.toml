# SRV-1 fixture: packages that depend on an engine crate, each in its own way, and one that may.
[workspace]
resolver = "3"
members = ["direct", "renamed", "optional", "target-only", "at-build", "through", "facade", "generator", "allowed"]

# Foundation at the commit the root Cargo.toml pins.
[workspace.dependencies]
ironflowx = { git = "https://github.com/ironflowx/foundation", rev = "74183efff1af20b16a275b0dc2f39d59bc40b58c" }
