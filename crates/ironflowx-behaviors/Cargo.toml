[package]
name = "ironflowx-behaviors"
description = "Runs the behavior scenarios in docs/behaviors/ against the engine (D20). Unpublished."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
ironflowx-core.workspace = true
ironflowx-cell.workspace = true
ironflowx-events.workspace = true
ironflowx-operations.workspace = true
ironflowx-proto = { workspace = true, features = ["client", "wire"] }
serde_json.workspace = true
jsonschema = { version = "0.63.1", default-features = false }
prost-reflect = "0.16.5"
rustix = { version = "1.1.6", default-features = false, features = ["process", "std"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "json"] }
cucumber = "0.23.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }
futures = { version = "0.3.34", default-features = false }
http = { version = "1.5.0", default-features = false }

[[test]]
name = "behaviors"
harness = false
