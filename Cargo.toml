[workspace]
resolver = "3"
members = ["crates/*"]

# The binary carries foundation's release number until 1.0.0.
[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

# Foundation at one commit: CI tests this pin. A sibling checkout can stand in for it through a
# gitignored .cargo/config.toml (README.md, "Working on foundation too"). When foundation 0.4.0 is
# on crates.io, these become its versions.
[workspace.dependencies]
ironflowx-authz = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-cell = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-codegen = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-core = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-doors = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-events = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-operations = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-proto = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
ironflowx-store = { git = "https://github.com/ironflowx/foundation", rev = "d840c6cb611d44c8b43140d7f8efb4a9a8f53f07" }
# Event rules parse JSON with a visitor (foundation D12); no derive, no preserve_order.
serde_core = { version = "1.0.229", default-features = false, features = ["std"] }
# Exact, as foundation pins it: the 127-depth rule relies on serde_json's internal recursion limit.
# float_roundtrip: correctly rounded floats, so a number just past f64::MAX is out of range.
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }

# A panic in the server aborts it (SRV-15, D63): ci/serve-lifecycle.sh checks both profiles.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
