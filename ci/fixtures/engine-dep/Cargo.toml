ironflowx-cell = { git = "https://github.com/ironflowx/foundation", rev = "74183efff1af20b16a275b0dc2f39d59bc40b58c" }
ironflowx-codegen = { git = "https://github.com/ironflowx/foundation", rev = "74183efff1af20b16a275b0dc2f39d59bc40b58c" }
ironflowx-core = { git = "https://github.com/ironflowx/foundation", rev = "74183efff1af20b16a275b0dc2f39d59bc40b58c" }
ironflowx-events = { git = "https://github.com/ironflowx/foundation", rev = "74183efff1af20b16a275b0dc2f39d59bc40b58c" }
